[package]
name = "modulation-ui"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Modulation GUI — the five circuits, each with its own panel"

[lints]
workspace = true

[features]
default = []
# The painted visualiser: one picture per engine, on the GPU where there is
# one and in vectors where there is not. Wants a Blitz host for the
# custom-widget mechanism, which is why it is not on by default.
viz = ["dep:anyrender", "dep:blitz-dom", "dep:dioxus-native-dom", "dep:vello", "fts-audio-ui/shader"]
native = [
    "dep:nice-plug",
    "dep:fts-plug-ui",
    "dep:nice-plug-dioxus",
    "dep:architect-ui",
    "dep:atomic_float",
    "dep:parking_lot",
]

[dependencies]
architect-ui = { workspace = true, optional = true }
fts-audio-ui = { workspace = true }
anyrender = { workspace = true, optional = true }
blitz-dom = { workspace = true, features = ["custom-widget"], optional = true }
dioxus-native-dom = { workspace = true, optional = true }
vello = { workspace = true, optional = true }
nice-plug = { workspace = true, optional = true }
fts-plug-ui = { workspace = true, optional = true }
nice-plug-dioxus = { workspace = true, optional = true }
atomic_float = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
modulation-profiles = { workspace = true }
dioxus = { workspace = true }

[[test]]
name = "screenshots"
required-features = ["native"]

[[test]]
name = "engines_differ"
required-features = ["viz"]

[dev-dependencies]
dioxus = { workspace = true }
dioxus-test = { workspace = true }
# Validate the WGSL without a GPU — nothing else would catch a shader that
# does not compile until someone ran a plugin.
naga = { version = "29", features = ["wgsl-in"] }
# The engine contact sheet (examples/engine_sheet.rs) renders the real shader
# on a real device — see .
fts-audio-ui = { workspace = true, features = ["probe"] }
bytemuck = { version = "1", features = ["derive"] }
png = "0.18"
tokio = { workspace = true, features = ["macros", "rt"] }
