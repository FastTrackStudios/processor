[package]
name = "fx-blocks"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The built-in FX as native blocks — PluginInstance wrappers over the FX facades."

[lints]
workspace = true

[dependencies]
fts-sample = { workspace = true, features = ["load"] }
saturate-dsp = { workspace = true, features = ["analysis"] }
tune = { workspace = true }
daw-proto = { workspace = true }
# `PluginInstance` and friends. Taken from `daw` directly rather than
# through a host crate that merely re-exported them — that indirection
# is what tied these wrappers to one product.
# `standalone` is the feature that exposes `daw::plugin` — the same one
# signal-plugin-host turned on to re-export these types.
daw = { workspace = true, features = ["standalone"] }
pitch-dsp = { workspace = true }
audiocore-dsp = { workspace = true }
# FX facades (never the -dsp crates directly).
eq = { workspace = true }
comp = { workspace = true }
reverb = { workspace = true }
delay = { workspace = true }
level-dsp = { workspace = true }
modulation = { workspace = true }

[dev-dependencies]
midicore-proto = { workspace = true }
# Integration test: built-in FX through the standalone daw's Effects::add.
daw = { workspace = true, features = ["standalone"] }
