[package]
name = "reverb-ui"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Reverb GUI — the seven families, each with its own panel"

[lints]
workspace = true

[features]
default = []
# The painted visualiser: what the effect is actually doing, on the GPU where
# there is one and in vectors where there is not. Wants a Blitz host for the
# custom-widget mechanism, which is why it is not on by default.
viz = ["dep:anyrender", "dep:blitz-dom", "dep:dioxus-native-dom", "dep:vello", "dep:bytemuck", "fts-audio-ui/shader"]
native = [
    "dep:nice-plug",
    "dep:fts-plug-ui",
    "dep:nice-plug-dioxus",
    "dep:architect-ui",
    "dep:atomic_float",
    "dep:parking_lot",
    # The shared EQ surface — the Post / Decay Rate EQ views embed eq-ui's
    # EqGraph (fx.embed-eq.one-surface).
    "dep:eq-ui",
    "eq-ui/native",
    # The shared preset browser — the same panel the EQ and compressor
    # editors mount.
    "dep:preset-browser",
    "dep:preset-browser-ui",
]

[dependencies]
architect-ui = { workspace = true, optional = true }
fts-audio-ui = { workspace = true }
anyrender = { workspace = true, optional = true }
blitz-dom = { workspace = true, features = ["custom-widget"], optional = true }
dioxus-native-dom = { workspace = true, optional = true }
vello = { workspace = true, optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
nice-plug = { workspace = true, optional = true }
fts-plug-ui = { workspace = true, optional = true }
nice-plug-dioxus = { workspace = true, optional = true }
atomic_float = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
eq-ui = { workspace = true, optional = true }
preset-browser = { workspace = true, optional = true }
preset-browser-ui = { workspace = true, optional = true }
reverb-profiles = { workspace = true }
musical-time = { workspace = true, features = ["params"] }
musical-time-ui = { workspace = true }
reverb-dsp = { workspace = true }
crossbeam-channel = { workspace = true }
dioxus = { workspace = true }

[[test]]
name = "screenshots"
required-features = ["native"]

[[test]]
name = "ir_browser"
required-features = ["native"]

[[test]]
name = "presets"
required-features = ["native"]

[[test]]
name = "knob_readouts"
required-features = ["native"]

[dev-dependencies]
dioxus = { workspace = true }
dioxus-test = { workspace = true }
# Validate the WGSL without a GPU — nothing else would catch a shader that
# does not compile until someone ran a plugin, because a surface that fails
# to build is indistinguishable from a renderer that declined.
naga = { version = "29", features = ["wgsl-in"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "param_round_trip"
required-features = ["native"]

[[test]]
name = "tempo_sync"
required-features = ["native"]
