[package]
name = "comp-ui"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "Compressor GUI — control view (knobs + GR meter), params, and profile theme rendering"

[lints]
workspace = true

[features]
# Core-only by default in the signal workspace (wasm remotes). The plugin
# builds enable `native` for the Blitz/nice-plug editor.
default = []
# The painted visualiser: the transfer curve and the detector's own traces,
# on the GPU where there is one and in vectors where there is not. Data in,
# no parameter tree — see `viz::CompViz`, which is the half of the graph a
# detached surface can mount.
viz = ["dep:anyrender", "dep:blitz-dom", "dep:dioxus-native-dom", "dep:vello", "dep:bytemuck", "fts-audio-ui/shader"]
# The Blitz/vello plugin editor: control view, nice-plug param tree, param
# adapter. Off → only the portable core (profile view data model) compiles.
native = [
    "dep:musical-time",
    "dep:musical-time-ui",
    "dep:nice-plug",
    "dep:fts-plug-ui",
    "dep:nice-plug-dioxus",
    "dep:audiocore-core",
    "dep:architect-ui",
    "dep:atomic_float",
    "dep:parking_lot",
    # The shared EQ surface — each stage's sidechain-EQ sidecar embeds
    # eq-ui's EqGraph (fx.embed-eq.one-surface).
    "dep:eq-ui",
    "eq-ui/native",
    # The shared preset surfaces (fx.presets.one-browser).
    "dep:preset-browser",
    "dep:preset-browser-ui",
]

[dependencies]
audiocore-core = { workspace = true, optional = true }
architect-ui = { workspace = true, optional = true }
fts-audio-ui = { workspace = true }
# The painted widget keeps its own clock, and `std::time::Instant` panics
# in a browser.
web-time = { workspace = true }
anyrender = { workspace = true, optional = true }
blitz-dom = { workspace = true, features = ["custom-widget"], optional = true }
dioxus-native-dom = { workspace = true, optional = true }
vello = { workspace = true, optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
nice-plug = { workspace = true, optional = true }
fts-plug-ui = { workspace = true, optional = true }
preset-browser = { workspace = true, optional = true }
preset-browser-ui = { workspace = true, optional = true }
nice-plug-dioxus = { workspace = true, optional = true }
atomic_float = { workspace = true, optional = true }
# The persisted profile id (see params::CompParams::profile_id) — nice-plug's
# `#[persist]` wants a field with interior mutability.
parking_lot = { workspace = true, optional = true }
comp-profiles = { path = "../comp-profiles" }
# The editor's tempo-synced sections only (`sections`, `params`), so they
# come with `native`: the portable core is wasm-safe without the plugin
# framework `musical-time` pulls in.
musical-time = { workspace = true, features = ["params"], optional = true }
musical-time-ui = { workspace = true, optional = true }
eq-ui = { workspace = true, optional = true }
# Not dev-only: the preset surfaces are part of the editor, so the crate
# needs `rsx!`/`Signal` in its own source and not just in its tests.
dioxus = { workspace = true }

# The real-editor behavioral tests (tests/gui_editor.rs) mount
# `control_view::App` — the `native`-gated plugin editor surface — on the
# dioxus-test harness. Declared explicitly with required-features so a plain
# `cargo test -p comp-ui` (no features) still builds and just skips it.
[[test]]
name = "gui_editor"
required-features = ["native"]

# The screenshot harness paints the same mount to PNGs (see tests/screenshots.rs)
# — a look-at-it aid, not an assertion suite. Same feature gate.
[[test]]
name = "screenshots"
required-features = ["native"]

[dev-dependencies]
# Headless GUI tests: REAL event dispatch on a headless Blitz DOM via the
# vendored dioxus-test (libs/vendor/dioxus-test) — same harness as eq-ui.
dioxus = { workspace = true }
dioxus-test = { workspace = true }
# Validate the WGSL without a GPU — nothing else would catch a shader that
# does not compile until someone ran a plugin, because a surface that fails
# to build is indistinguishable from a renderer that declined.
naga = { version = "29", features = ["wgsl-in"] }
# The panel sheet (examples/comp_sheet.rs) renders the real shader on a real
# device — see `fts_audio_ui::shader::probe`.
fts-audio-ui = { workspace = true, features = ["probe"] }
png = "0.18"
tokio = { workspace = true, features = ["macros", "rt"] }

[[test]]
name = "param_round_trip"
required-features = ["native"]

[[test]]
name = "tempo_sync"
required-features = ["native"]
