[package]
name = "eq-ui"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
description = "EQ GUI — control view (spectrum + nodes) and profile theme rendering"

[lints]
workspace = true

# The plugin's custom-widget host. Native only: it brings baseview (a
# windowing library — there is no window in a browser) and nice-plug's
# filesystem logging. The graph itself needs none of that; in a browser it
# paints onto a canvas instead (`fts_audio_ui::scene_canvas`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nice-plug-dioxus = { workspace = true, optional = true }

[features]
# Core-only by default in the signal workspace (wasm remotes). The plugin
# builds enable `native` for the vello/nice-plug editor.
default = []
# The Blitz/vello plugin editor: control view, painter, nice-plug param
# tree. Off → only the portable core (graph model / response math / SVG
# path generation / interaction helpers) compiles — wasm-safe, used by the
# detached remotes.
# The vello EQ graph, without the plugin's parameter tree.
#
# `graph` is the editor's own surface — `eq_graph` + its painter and popup —
# as an embeddable widget: `bands: Signal<Vec<EqBand>>` in, band events out.
# It needs a Blitz host for the custom-widget mechanism and nothing else, so
# anything rendering on `dioxus-native` can mount the real graph: the rig
# remotes over the wire, the session mixer's channel strips, the editors that
# embed one EQ inside another.
#
# Split out of `native` because the rest of `native` is the plugin — the
# nice-plug parameter tree, `ParamPtr`, the preset browser, the hardware faces
# — and a detached surface has none of that and wants none of it.
# The graph's painters alone: `anyrender` command lists and the geometry
# they are written in — no plugin host, no GPU stack, no DOM. This is what
# lets the same picture be drawn by a browser's canvas surface.
graph-paint = ["dep:anyrender", "dep:kurbo", "dep:peniko", "spectrum-analyzer/ui"]
graph = [
    "graph-paint",
    "dep:nice-plug-dioxus",
    "dep:bytemuck",
    "fts-audio-ui/shader",
    "dep:architect-ui",
    "dep:futures-timer",
    "dep:atomic_float",
    "spectrum-analyzer/ui",
]
native = [
    "graph",
    # The plugin editor mounts the analyser's settings panel.
    "spectrum-analyzer/ui-panel",
    "dep:nice-plug",
    "dep:fts-plug-ui",
    "dep:audiocore-core",
    "dep:eq-profiles",
    # The shared preset browser — the same surfaces the reverb and compressor
    # editors mount.
    "dep:preset-browser",
    "dep:preset-browser-ui",
]
# Tests that need a real GPU adapter (`render_screenshot`). Off by default
# so headless CI can run `cargo test -p eq-ui` without a Vulkan-capable
# runner; opt in with `--features gpu-tests` locally.
gpu-tests = []

[dependencies]

# Not used in code — this is here to turn ON blitz-dom's `autofocus` feature,
# which is off by default. Without it the `autofocus` attribute is inert, and
# a text field that appears in response to a click can never take focus:
# `MountedData::set_focus` is the only alternative, and calling it from an
# event handler panics ("RefCell already borrowed") because the document is
# still borrowed by the dispatch that created the node. Cargo features are
# additive across the graph, so declaring it once here enables it for every
# plugin that embeds this UI.
blitz-dom = { workspace = true, features = ["autofocus"] }
eq-dsp = { workspace = true }
# The graph keeps its own clocks (the glow's age, the popup's fade), and
# `std::time` panics in a browser.
web-time = { workspace = true }
# The painters' own dependencies (see `graph-paint`).
anyrender = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
peniko = { workspace = true, optional = true }
audiocore-core = { workspace = true, optional = true }
architect-ui = { workspace = true, optional = true }
fts-audio-ui = { workspace = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
nice-plug = { workspace = true, optional = true }
fts-plug-ui = { workspace = true, optional = true }
atomic_float = { workspace = true, optional = true }
parking_lot = "0.12"
eq-profiles = { path = "../eq-profiles", optional = true }
# Not dev-only: the editor modules use `rsx!` / `Signal` directly rather than
# picking dioxus up from another crate's prelude, which is what the rest of
# the suite does and what makes the imports say where things come from.
dioxus = { workspace = true }
preset-browser = { workspace = true, optional = true }
preset-browser-ui = { workspace = true, optional = true }
spectrum-analyzer = { workspace = true }
# 60Hz redraw tick driver. We use futures-timer (not tokio::time) because
# dioxus_native doesn't bring up a tokio runtime by default, so
# tokio::time::sleep panics silently inside use_future. futures-timer's
# Delay uses its own dedicated timer thread and works on any executor —
# including dioxus's built-in task scheduler.
futures-timer = { version = "3", optional = true }

# The real-editor behavioral tests (tests/gui_editor.rs) mount
# `control_view::App` — the `native`-gated plugin editor surface — on the
# dioxus-test harness. Declared explicitly with required-features so a plain
# `cargo test -p eq-ui` (no features) still builds and just skips it.
[[test]]
name = "gui_editor"
required-features = ["native"]

# The screenshot harness paints the real editor to PNGs (tests/screenshots.rs)
# — a look-at-it aid, not an assertion suite. Same feature gate.
[[test]]
name = "screenshots"
required-features = ["native"]

[dev-dependencies]
# Validate the WGSL without a GPU — nothing else catches a shader that does
# not compile until someone runs a plugin.
naga = { version = "29", features = ["wgsl-in"] }
# Headless GUI tests:
# - tests/gui_smoke.rs — SSR structure tests (plain VirtualDom + dioxus-ssr).
# - tests/gui_headless.rs — REAL event dispatch on a headless Blitz DOM via
#   the vendored dioxus-test (libs/vendor/dioxus-test, backported to the
#   workspace dioxus 0.7.9 + blitz pins — no 0.8-alpha migration needed).
dioxus = { workspace = true }
dioxus-ssr = { git = "https://github.com/DioxusLabs/dioxus", rev = "f717a8e184a522d078b70bb4b4d62a5f9a99ddfc", default-features = false }
dioxus-test = { workspace = true }
# Right-button pointer events: `dioxus-test` only ships primary-button
# helpers, and the band-label rename is a RIGHT double-click, so the
# tests build those `UiEvent`s directly. Same pin as dioxus-test's own.
blitz-traits = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
test-that = { version = "0.5.2", default-features = false, features = ["regex", "num-traits"] }
pollster = "0.4"
# Only the render_smoke GPU test uses wgpu directly; keep it in lockstep with
# nice-plug-dioxus's wgpu (29) so vello's render_to_texture types line up.
wgpu = "29"

[[test]]
name = "param_round_trip"
required-features = ["native"]
