[package]
name = "spectrum-analyzer-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Spectrum analyzer painters + settings panel for FTS-EQ"

# Per-feature UI for the spectrum analyzer: the painters (composited into the
# EQ graph's scene) and a Dioxus settings panel.
#
# The painters record into an `anyrender::Scene` and need nothing else — so
# they compile anywhere the picture is wanted, browsers included. The panel
# is a plugin editor's, and its nice-plug / audiocore stack sits behind the
# `panel` feature.

[lints]
workspace = true

[dependencies]
# Direct dioxus dep: in the signal workspace audiocore-core is built without
# its dioxus re-exports (default-features = false), so the prelude items
# (Props/Callback/rsx) must come from dioxus itself.
dioxus = { workspace = true }
spectrum-analyzer-dsp = { workspace = true }
# The painters' whole dependency: a command list and the geometry it is
# written in.
anyrender = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
nice-plug-dioxus = { workspace = true, optional = true }
audiocore-core = { workspace = true, optional = true }
architect-ui = { workspace = true, optional = true }
fts-audio-ui = { workspace = true, optional = true }

[features]
default = []
# The Dioxus settings panel — a plugin editor's panel, with the plugin stack
# behind it.
panel = ["dep:nice-plug-dioxus", "dep:audiocore-core", "dep:architect-ui", "dep:fts-audio-ui"]
